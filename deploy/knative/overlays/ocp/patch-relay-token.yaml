# Source the relay's bearer token from a Secret instead of the base manifest's literal (#173).
#
# relay-deployment.yaml declares `SH_RELAY_TOKEN: dev-token`. That is a deliberate, documented
# public value for Kind/local dev -- but the same file is a shared resource of THIS overlay, so
# without a patch that dev value is a valid credential on any OCP-deployed relay, sitting in the
# Deployment spec for anyone with get/list on Deployments in the namespace.
#
# Patched here rather than in the base because the base is also applied bare
# (`kubectl apply -f relay-deployment.yaml`) by demo-remote-worker.sh, relay-leaf-smoke.sh and
# README-worker.md's Step 1. Relay auth is fail-closed, so a base that referenced a Secret would
# turn "Secret not created yet" into "every worker Attach rejected" on all of those paths.
#
# `value: null` deletes the literal the base sets; strategic merge alone would leave both fields
# present, which the API server rejects (value and valueFrom are mutually exclusive).
#
# Create the Secret before applying this overlay -- remote-worker/deploy-incluster.sh does it,
# and it is the same Secret and key the worker reads its SANDBOX_TOKEN from, which is what keeps
# the two sides equal:
#
#   oc create secret generic sh-relay-token -n <ns> --from-literal=SH_RELAY_TOKEN=<token>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-relay
spec:
  template:
    spec:
      containers:
        - name: sandbox-relay
          env:
            - name: SH_RELAY_TOKEN
              value: null
              valueFrom:
                secretKeyRef:
                  name: sh-relay-token
                  key: SH_RELAY_TOKEN
