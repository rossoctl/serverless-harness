# In-cluster remote-worker Deployment (template — deploy-incluster.sh fills the
# __PLACEHOLDERS__). Runs the worker as a pod so relay->worker execs stay inside
# the cluster (no `oc port-forward` push latency). restricted-v2 compatible.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-worker
  namespace: __NS__
  labels:
    app: remote-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remote-worker
  template:
    metadata:
      labels:
        app: remote-worker
    spec:
      serviceAccountName: remote-worker
      containers:
        - name: remote-worker
          image: __IMAGE__
          imagePullPolicy: Always
          env:
            - name: SANDBOX_ID
              value: __SANDBOX_ID__
            - name: RELAY_ADDR
              value: sandbox-relay.__NS__.svc:8443
            # Sourced from a Secret, never substituted in: a literal here put the live token
            # into the Deployment spec, `oc describe`, and any GitOps mirror of this
            # namespace (#173). deploy-incluster.sh creates the Secret.
            #
            # The key is SH_RELAY_TOKEN rather than SANDBOX_TOKEN on purpose. This value must
            # equal the relay's SH_RELAY_TOKEN -- auth is fail-closed, so a mismatch rejects
            # every Attach -- and both sides reading one key makes that equality structural
            # instead of something a test has to compare.
            - name: SANDBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sh-relay-token
                  key: SH_RELAY_TOKEN
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001 # matches the image's USER 1001; nonroot-v2 SCC allows it
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
          # Memory must cover the worker's own buffering, not just its idle size.
          # A non-streaming exec (Exec.streaming = false — the proto3 DEFAULT, and
          # relay-supplied, so a buggy relay reaches it with no privilege) buffers
          # up to exec.BufferCap per stream:
          #   2 streams (stdout+stderr) x MaxConcurrent (4) x BufferCap (8 MiB)
          #   = 64 MiB, plus ~1.5-2x transiently while bytes.Buffer doubles.
          # A 64Mi limit was therefore an OOMKill the relay could trigger at will.
          # Keep this in sync with BufferCap in internal/exec/runner.go.
          resources:
            requests: { cpu: '10m', memory: '64Mi' }
            limits: { memory: '256Mi' }
